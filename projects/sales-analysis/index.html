<body>
  <main class="app">
    <h1>Sales Analysis</h1>
    <p class="subtitle">Sample practice data of a small store, January to March (not real sales).</p>

    <section class="cards">
      <div class="card"><span>Total sales</span><strong id="total"></strong></div>
      <div class="card"><span>Best-selling product</span><strong id="best"></strong></div>
      <div class="card"><span>Average per product</span><strong id="avg"></strong></div>
    </section>

    <h2>Total Sales by Product (PHP)</h2>
    <div id="chart" class="chart"></div>

    <h2>Monthly Sales (PHP)</h2>
    <table id="monthTable"><thead><tr><th>Month</th><th>Total Sales (PHP)</th></tr></thead><tbody></tbody></table>

    <p class="note">Data is in <code>sales.csv</code>. The SQL queries are in <code>queries.sql</code>.</p>
  </main>
